{% extends "base.html" %}

{% block title %}Crear Pedido - CLC Warm Pink MVC{% endblock %}

{% block content %}
<div style="max-width: 550px; margin: 2rem auto;">
    <div class="card-pastel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2><i class="fa-solid fa-cart-plus"></i> Crear Pedido</h2>
            <a href="{{ url_for('pedido.tpedido') }}" class="btn-pastel btn-pink btn-sm"><i class="fa-solid fa-arrow-left"></i> Volver</a>
        </div>

        <form action="{{ url_for('pedido.add_pedido') }}" method="POST" class="form-pastel">
            <div class="form-group">
                <label for="cod_pe"><i class="fa-solid fa-hashtag"></i> Código Pedido</label>
                <input type="number" id="cod_pe" name="cod_pe" class="form-control-pastel" placeholder="Ej. 100" required>
            </div>

            <div class="form-group">
                <label for="f_pe"><i class="fa-solid fa-calendar"></i> Fecha del Pedido</label>
                <input type="date" id="f_pe" name="f_pe" class="form-control-pastel" required>
            </div>

            <div class="form-group">
                <label for="cant_pe"><i class="fa-solid fa-layer-group"></i> Cantidad de Artículos</label>
                <input type="number" id="cant_pe" name="cant_pe" class="form-control-pastel" placeholder="Ej. 3" required>
            </div>

            <div class="form-group">
                <label for="vt_pe"><i class="fa-solid fa-money-bill-wave"></i> Valor Total</label>
                <input type="text" id="vt_pe" name="vt_pe" class="form-control-pastel" placeholder="Ej. $150.000" required>
            </div>

            <div class="form-group">
                <label for="cod_cli1"><i class="fa-solid fa-user"></i> Código del Cliente</label>
                <input type="number" id="cod_cli1" name="cod_cli1" class="form-control-pastel" placeholder="Ej. 1" required>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn-pastel btn-purple" style="flex: 1;"><i class="fa-solid fa-floppy-disk"></i> Guardar Pedido</button>
                <button type="reset" class="btn-pastel btn-pink" style="flex: 1;"><i class="fa-solid fa-rotate-left"></i> Limpiar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
