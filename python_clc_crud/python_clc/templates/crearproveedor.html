{% extends "base.html" %}

{% block title %}Crear Proveedor - CLC Warm Pink MVC{% endblock %}

{% block content %}
<div style="max-width: 650px; margin: 2rem auto;">
    <div class="card-pastel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2><i class="fa-solid fa-truck-field-un"></i> Crear Proveedor</h2>
            <a href="{{ url_for('proveedor.tproveedor') }}" class="btn-pastel btn-pink btn-sm"><i class="fa-solid fa-arrow-left"></i> Volver</a>
        </div>

        <form action="{{ url_for('proveedor.add_proveedor') }}" method="POST" class="form-pastel">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem;">
                <div class="form-group">
                    <label for="cod_prov"><i class="fa-solid fa-hashtag"></i> Código Proveedor</label>
                    <input type="number" id="cod_prov" name="cod_prov" class="form-control-pastel" placeholder="Ej. 12" required>
                </div>

                <div class="form-group">
                    <label for="nom_prov"><i class="fa-solid fa-user"></i> Nombre Proveedor</label>
                    <input type="text" id="nom_prov" name="nom_prov" class="form-control-pastel" placeholder="Ej. Hilos y Tejidos S.A." required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem;">
                <div class="form-group">
                    <label for="tel_prov"><i class="fa-solid fa-phone"></i> Teléfono</label>
                    <input type="text" id="tel_prov" name="tel_prov" class="form-control-pastel" placeholder="3101234567" required>
                </div>

                <div class="form-group">
                    <label for="corr_prov"><i class="fa-solid fa-envelope"></i> Correo Electrónico</label>
                    <input type="email" id="corr_prov" name="corr_prov" class="form-control-pastel" placeholder="contacto@hilos.com" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem;">
                <div class="form-group">
                    <label for="trans_prov"><i class="fa-solid fa-truck"></i> Medio de Transporte</label>
                    <input type="text" id="trans_prov" name="trans_prov" class="form-control-pastel" placeholder="Ej. Camión / Moto">
                </div>

                <div class="form-group">
                    <label for="edad_prov"><i class="fa-solid fa-cake-candles"></i> Edad</label>
                    <input type="number" id="edad_prov" name="edad_prov" class="form-control-pastel" placeholder="Ej. 35">
                </div>
            </div>

            <div class="form-group">
                <label for="direc_prov"><i class="fa-solid fa-location-dot"></i> Dirección</label>
                <input type="text" id="direc_prov" name="direc_prov" class="form-control-pastel" placeholder="Ej. Cra 15 # 20-30" required>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem;">
                <div class="form-group">
                    <label for="sexo_prov"><i class="fa-solid fa-venus-mars"></i> Sexo</label>
                    <input type="text" id="sexo_prov" name="sexo_prov" class="form-control-pastel" placeholder="Femenino / Masculino">
                </div>

                <div class="form-group">
                    <label for="tipoid_prov"><i class="fa-solid fa-id-card"></i> Tipo Identificación</label>
                    <input type="text" id="tipoid_prov" name="tipoid_prov" class="form-control-pastel" placeholder="Cédula / NIT">
                </div>
            </div>

            <div class="form-group">
                <label for="id_prov"><i class="fa-solid fa-fingerprint"></i> N° Identificación / NIT</label>
                <input type="number" id="id_prov" name="id_prov" class="form-control-pastel" placeholder="900123456" required>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn-pastel btn-purple" style="flex: 1;"><i class="fa-solid fa-floppy-disk"></i> Guardar Proveedor</button>
                <button type="reset" class="btn-pastel btn-pink" style="flex: 1;"><i class="fa-solid fa-rotate-left"></i> Limpiar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
