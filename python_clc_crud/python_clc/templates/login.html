{% extends "base.html" %}

{% block title %}Iniciar Sesión - CLC Pastel MVC{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
    <div class="card-pastel" style="text-align: center;">
        <div style="font-size: 2.5rem; color: var(--accent-purple); margin-bottom: 1rem;">
            <i class="fa-solid fa-user-lock"></i>
        </div>
        <h2>Iniciar Sesión</h2>
        <p class="subtitle">Ingresa tus credenciales para acceder al sistema</p>

        <form action="{{ url_for('auth.login') }}" method="POST" class="form-pastel">
            <div class="form-group" style="text-align: left;">
                <label for="nom_us"><i class="fa-solid fa-envelope"></i> Usuario o Correo Electrónico</label>
                <input type="text" id="nom_us" name="nom_us" class="form-control-pastel" placeholder="tu_usuario@correo.com" required>
            </div>

            <div class="form-group" style="text-align: left;">
                <label for="con_us"><i class="fa-solid fa-lock"></i> Contraseña</label>
                <input type="password" id="con_us" name="con_us" class="form-control-pastel" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-pastel btn-purple" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
            </button>
        </form>

        <div style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            ¿No tienes una cuenta? 
            <a href="{{ url_for('usuario.crearusuario') }}" style="color: var(--accent-purple); font-weight: 600; text-decoration: none;">Regístrate aquí</a>
        </div>
    </div>
</div>
{% endblock %}
