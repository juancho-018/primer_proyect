{% extends "base.html" %}

{% block title %}Registrar Venta - CLC Warm Pink MVC{% endblock %}

{% block content %}
<div style="max-width: 550px; margin: 2rem auto;">
    <div class="card-pastel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2><i class="fa-solid fa-cash-register"></i> Registrar Venta</h2>
            <a href="{{ url_for('venta.tventa') }}" class="btn-pastel btn-pink btn-sm"><i class="fa-solid fa-arrow-left"></i> Volver</a>
        </div>

        <form action="{{ url_for('venta.add_venta') }}" method="POST" class="form-pastel">
            <div class="form-group">
                <label for="cod_ven"><i class="fa-solid fa-hashtag"></i> Código Venta</label>
                <input type="number" id="cod_ven" name="cod_ven" class="form-control-pastel" placeholder="Ej. 50" required>
            </div>

            <div class="form-group">
                <label for="cod_pe1"><i class="fa-solid fa-receipt"></i> Código Pedido</label>
                <input type="number" id="cod_pe1" name="cod_pe1" class="form-control-pastel" placeholder="Ej. 2" required>
            </div>

            <div class="form-group">
                <label for="cod_p1"><i class="fa-solid fa-box"></i> Código Producto</label>
                <input type="number" id="cod_p1" name="cod_p1" class="form-control-pastel" placeholder="Ej. 3" required>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn-pastel btn-purple" style="flex: 1;"><i class="fa-solid fa-floppy-disk"></i> Guardar Venta</button>
                <button type="reset" class="btn-pastel btn-pink" style="flex: 1;"><i class="fa-solid fa-rotate-left"></i> Limpiar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
